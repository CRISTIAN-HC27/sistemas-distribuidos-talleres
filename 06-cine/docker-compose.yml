services:
  mongo:
    image: mongo:7
    container_name: cine-mongo
    ports: ["27017:27017"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16
    container_name: cine-postgres
    environment:
      POSTGRES_USER: cine
      POSTGRES_PASSWORD: cine
      POSTGRES_DB: cine
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cine -d cine"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mongo-data:
  postgres-data:
